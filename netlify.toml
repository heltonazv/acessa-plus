# ACESSA+ · configuração de publicação
# Site estático de arquivo único. Não há build: o Netlify publica a raiz do
# repositório como está, e cada push na branch principal gera um deploy.

[build]
  publish = "."
  command = ""

# Cabeçalhos de segurança e de privacidade.
# A CSP é restritiva de propósito: depois que a fonte passou a ser hospedada
# junto, a página não precisa de nenhum recurso externo. Se algum dia precisar,
# libere aqui, explicitamente, em vez de afrouxar tudo.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# A fonte tem nome estável e conteúdo imutável: pode ficar em cache por um ano.
[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O HTML precisa ser revalidado sempre, senão uma correção de conteúdo demora
# a chegar em quem já visitou. Num site sobre direitos, isso importa.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
